<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">THABAT system architecture</title><desc id="desc">Smart glove sensing provides movement and stability data for rule-based performance evaluation, which produces dashboard indicators and training feedback. Unity mixed reality simulation and adaptive training manager support three training levels and performance reports.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#44d3c8" stroke-width="1.6"/></marker><style>text{font-family:Inter,Arial,sans-serif}.h{font-size:27px;font-weight:700;fill:#edf7f8}.s{font-size:15px;fill:#a7c0c8}.box{fill:#112c3b;stroke:#386274;stroke-width:1.6}.label{font-size:19px;font-weight:650;fill:#eaf8fa}.sub{font-size:14px;fill:#a9c6cc}.line{stroke:#44d3c8;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.tag{font-size:12px;font-weight:700;fill:#48ded0;letter-spacing:2px}</style></defs>
<rect width="1200" height="660" rx="18" fill="#081b28"/><rect x="1" y="1" width="1198" height="658" rx="17" fill="none" stroke="#234757"/>
<text x="64" y="66" class="tag">THABAT / SYSTEM DESIGN</text><text x="64" y="108" class="h">Training System Architecture</text><text x="64" y="136" class="s">Functional overview of sensing, performance evaluation, and immersive training</text>
<rect class="box" x="55" y="190" rx="12" width="300" height="100"/><text class="label" x="205" y="228" text-anchor="middle">Smart Glove</text><text class="sub" x="205" y="256" text-anchor="middle">Movement and stability sensing</text>
<rect class="box" x="450" y="190" rx="12" width="300" height="100"/><text class="label" x="600" y="228" text-anchor="middle">Performance Evaluation</text><text class="sub" x="600" y="256" text-anchor="middle">Rule-based stability and speed checks</text>
<rect class="box" x="845" y="170" rx="12" width="300" height="100"/><text class="label" x="995" y="208" text-anchor="middle">Monitoring Dashboard</text><text class="sub" x="995" y="236" text-anchor="middle">Color-coded status indicators</text>
<rect class="box" x="845" y="310" rx="12" width="300" height="100"/><text class="label" x="995" y="348" text-anchor="middle">Training Feedback</text><text class="sub" x="995" y="376" text-anchor="middle">Warnings, scores and outcomes</text>
<rect class="box" x="55" y="450" rx="12" width="300" height="100"/><text class="label" x="205" y="488" text-anchor="middle">Unity MR Simulation</text><text class="sub" x="205" y="516" text-anchor="middle">Interactive training environment</text>
<rect class="box" x="450" y="450" rx="12" width="300" height="100"/><text class="label" x="600" y="488" text-anchor="middle">Training Manager</text><text class="sub" x="600" y="516" text-anchor="middle">Levels, timing and session flow</text>
<rect class="box" x="845" y="450" rx="12" width="300" height="100"/><text class="label" x="995" y="486" text-anchor="middle">Training Outputs</text><text class="sub" x="995" y="511" text-anchor="middle">Three levels and final reports</text>
